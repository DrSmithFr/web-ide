<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Web IDE</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_relay/bootstrap.css">
</head>
<body>
<div id="status">
  <main class="card">
    <header class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" class="logo-bg"/>
        <path d="M16 15v10M12.5 25h7" class="logo-mast"/>
        <circle cx="16" cy="13" r="2.2" class="logo-dot"/>
        <path d="M11.5 8.5a6.4 6.4 0 0 0 0 9M20.5 8.5a6.4 6.4 0 0 1 0 9M8.3 5.5a10.8 10.8 0 0 0 0 15M23.7 5.5a10.8 10.8 0 0 1 0 15" class="logo-wave"/>
      </svg>
      <div>
        <div class="name" id="brand">Web IDE</div>
        <div class="host" id="host"></div>
      </div>
    </header>
    <div id="msg" aria-live="polite"><div class="spin"></div><p class="center muted">Connecting…</p></div>
    <footer id="foot" hidden></footer>
  </main>
</div>
<iframe id="frame" title="Web IDE"></iframe>
<div id="update" role="status" hidden></div>
<script type="module" src="/_relay/bootstrap.js"></script>
</body>
</html>
