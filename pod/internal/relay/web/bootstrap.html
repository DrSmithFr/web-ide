<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web IDE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fde'/%3E%3Cpath d='M6 4 2.5 8 6 12M10 4l3.5 4L10 12' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#111318;color:#d7dbe0;font:14px/1.4 system-ui,sans-serif}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
  #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #msg{max-width:420px;text-align:center;color:#aeb4bc}
  #msg .err{color:#e5a1a1}
  .spin{width:22px;height:22px;margin:0 auto 12px;border:2px solid #3a4048;border-top-color:#8aa;border-radius:50%;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<div id="status"><div id="msg"><div class="spin"></div>Connecting…</div></div>
<iframe id="frame" title="Web IDE"></iframe>
<script type="module" src="/_relay/bootstrap.js"></script>
</body>
</html>
